# Tiny Tapeout project information
project:
  title:        "4-bit Down Counter"      # প্রজেক্টের নাম
  description:  "A simple 4-bit down counter using Verilog template" # প্রজেক্টের বর্ণনা
  author:       "monirulislam12k"         # আপনার নাম
  discord:      ""                        # খালি রাখতে পারেন
  language:     "Verilog"
  clock_hz:     10000000                  # ১০ MHz (ডিফল্ট ক্লক স্পিড)

# How many tiles your design occupies?
tiles: "1x1"

# Your top level module name!
name: "counter4sinup"                     # 💡 আপনার মেইন মডিউলের নাম (cells.v ফাইলের নামের সাথে মিল রেখে)

# Pinout documentation
pinout:
  # Inputs
  ui[0]: "Enable Signal"
  ui[1]: "Unused"
  ui[2]: "Unused"
  ui[3]: "Unused"
  ui[4]: "Unused"
  ui[5]: "Unused"
  ui[6]: "Unused"
  ui[7]: "Unused"

  # Outputs
  uo[0]: "Count Bit 0"
  uo[1]: "Count Bit 1"
  uo[2]: "Count Bit 2"
  uo[3]: "Count Bit 3"
  uo[4]: "Unused"
  uo[5]: "Unused"
  uo[6]: "Unused"
  uo[7]: "Unused"

  # Bidirectional pins
  uio[0]: "Unused"
  uio[1]: "Unused"
  uio[2]: "Unused"
  uio[3]: "Unused"
  uio[4]: "Unused"
  uio[5]: "Unused"
  uio[6]: "Unused"
  uio[7]: "Unused"

# Do not change!
yaml_version: 6
